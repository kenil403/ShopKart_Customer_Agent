[project]
name = "shopkart-support-agent"
version = "1.2.0"
description = "ShopKart customer support agent: RAG + LangGraph + MCP + FastAPI"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
  # agent
  "langgraph>=0.2.60",
  "langchain>=1.0",
  "langchain-core>=1.0",
  # LLM providers (free tiers); router switches between them
  "langchain-groq>=1.0",
  "langchain-google-genai>=4.0",   # 4.x patches Gemini 3 thought signatures when switching providers
  "langchain-mistralai>=1.0",
  # MCP (v1 API: FastMCP). v2 renamed FastMCP -> MCPServer.
  "mcp>=1.9,<2",
  # RAG
  "rank-bm25>=0.2.2",
  # API
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "langgraph-checkpoint-sqlite>=2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[tool.uv]
package = false   # an application, not a library

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
